<!DOCTYPE html>
<html>
<head>
    <title>AI Notes API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
    <style>
        html, body { margin: 0; padding: 0; }
        #swagger-ui { padding: 20px; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
    <script>
        // Прокси для обхода CORS
        const corsProxy = 'https://api.allorigins.win/raw?url=';
        
        window.onload = function() {
            // Сначала загружаем YAML файл через прокси
            fetch(corsProxy + encodeURIComponent('https://raw.githubusercontent.com/penkov16/chempionat2026/main/AINotesAPI.yaml'))
                .then(response => response.text())
                .then(yamlText => {
                    // Заменяем URL сервера на прокси версию
                    const modifiedYaml = yamlText.replace(
                        'http://188.127.227.228:8080/api',
                        corsProxy + encodeURIComponent('http://188.127.227.228:8080/api')
                    );
                    
                    // Создаем blob URL для модифицированного YAML
                    const blob = new Blob([modifiedYaml], { type: 'text/yaml' });
                    const url = URL.createObjectURL(blob);
                    
                    // Инициализируем Swagger UI
                    window.ui = SwaggerUIBundle({
                        url: url,
                        dom_id: '#swagger-ui',
                        presets: [
                            SwaggerUIBundle.presets.apis,
                            SwaggerUIStandalonePreset
                        ],
                        layout: "StandaloneLayout",
                        requestInterceptor: function(request) {
                            // Для запросов к нашему API используем прокси
                            if (request.url.includes('188.127.227.228')) {
                                request.url = corsProxy + encodeURIComponent(request.url);
                            }
                            return request;
                        }
                    });
                })
                .catch(error => {
                    console.error('Error loading YAML:', error);
                    document.getElementById('swagger-ui').innerHTML = 
                        '<h2>Error loading documentation</h2><pre>' + error + '</pre>';
                });
        };
    </script>
</body>
</html>
