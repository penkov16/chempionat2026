<!DOCTYPE html>
<html>
<head>
    <title>AI Notes API Documentation</title>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="API documentation for AI Notes service">
    
    <!-- Swagger UI CSS с CDN -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui.css">
    
    <style>
        html { 
            box-sizing: border-box; 
            overflow: -moz-scrollbars-vertical; 
            overflow-y: scroll; 
        }
        *, *:before, *:after { 
            box-sizing: inherit; 
        }
        body { 
            margin: 0; 
            background: #fafafa; 
        }
        #swagger-ui { 
            padding: 20px; 
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Индикатор загрузки -->
    <div id="loading" class="loading">
        <h2>Loading API Documentation...</h2>
        <p>If this takes too long, check console for errors (F12).</p>
    </div>
    
    <!-- Контейнер для Swagger UI -->
    <div id="swagger-ui" style="display: none;"></div>
    
    <!-- Swagger UI JS с CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
    
    <script>
        // Ждем полной загрузки страницы
        window.onload = function() {
            try {
                // Инициализируем Swagger UI
                window.ui = SwaggerUIBundle({
                    // Указываем URL к вашему YAML файлу
                    // Для Vercel используем относительный путь
                    url: "./AINotesAPI.yaml",
                    
                    // Для GitHub Pages RAW ссылку:
                    // url: "https://raw.githubusercontent.com/penkov16/chempionat2026/main/AINotesAPI.yaml",
                    
                    dom_id: '#swagger-ui',
                    deepLinking: true,
                    presets: [
                        SwaggerUIBundle.presets.apis,
                        SwaggerUIStandalonePreset
                    ],
                    plugins: [
                        SwaggerUIBundle.plugins.DownloadUrl
                    ],
                    layout: "StandaloneLayout",
                    defaultModelsExpandDepth: 1,
                    defaultModelExpandDepth: 1,
                    defaultModelRendering: "example",
                    displayRequestDuration: true,
                    docExpansion: "list",
                    filter: true,
                    showExtensions: true,
                    showCommonExtensions: true,
                    operationsSorter: "alpha",
                    tagsSorter: "alpha",
                    validatorUrl: null, // Отключаем внешний валидатор
                    
                    // Callback при успешной загрузке
                    onComplete: function() {
                        console.log('Swagger UI loaded successfully');
                        // Скрываем индикатор загрузки, показываем Swagger UI
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('swagger-ui').style.display = 'block';
                    }
                });
                
            } catch (error) {
                console.error('Error initializing Swagger UI:', error);
                document.getElementById('loading').innerHTML = 
                    '<h2 style="color: red;">Error Loading Documentation</h2>' +
                    '<pre>' + error.message + '</pre>' +
                    '<p>Please check the browser console (F12) for details.</p>';
            }
        };
        
        // Обработка ошибок загрузки Swagger UI
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK') {
                console.error('Failed to load resource:', e.target.src || e.target.href);
                document.getElementById('loading').innerHTML = 
                    '<h2 style="color: red;">Failed to Load Resources</h2>' +
                    '<p>Unable to load Swagger UI from CDN.</p>' +
                    '<p>Possible solutions:</p>' +
                    '<ul>' +
                    '<li>Check internet connection</li>' +
                    '<li>Try refreshing the page</li>' +
                    '<li>Contact administrator if problem persists</li>' +
                    '</ul>';
            }
        }, true);
    </script>
</body>
</html>
